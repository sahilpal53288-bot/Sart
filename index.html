<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Galactic War 3D - Ultra Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #020208; overflow: hidden; font-family: 'Orbitron', 'Segoe UI', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        /* Sci-Fi HUD Overlay */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; box-sizing: border-box;
        }
        .hud-panel {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 15, 30, 0.65); border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 10px; padding: 12px 25px; backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }
        .hud-item { color: #00f0ff; font-weight: bold; font-size: 16px; letter-spacing: 1.5px; text-shadow: 0 0 8px #00f0ff; }
        .hud-item span { color: #fff; }
        .health-bar-container { width: 150px; height: 12px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; border: 1px solid #00f0ff; }
        #health-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff0055, #00f0ff); transition: width 0.3s; }

        /* Controls UI */
        .controls { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; pointer-events: auto; padding-bottom: 10px; }
        .btn-group { display: flex; gap: 15px; }
        .control-btn {
            width: 70px; height: 70px; border-radius: 50%; background: rgba(0, 240, 255, 0.1);
            border: 2px solid #00f0ff; color: #00f0ff; font-weight: bold; font-size: 18px;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            touch-action: manipulation; cursor: pointer;
        }
        .control-btn:active { background: rgba(0, 240, 255, 0.4); transform: scale(0.92); }
        .fire-btn {
            width: 85px; height: 85px; background: rgba(255, 0, 85, 0.25); border-color: #ff0055;
            color: #ff0055; box-shadow: 0 0 25px rgba(255, 0, 85, 0.6); font-size: 14px; text-shadow: 0 0 5px #ff0055;
        }
        .fire-btn:active { background: rgba(255, 0, 85, 0.6); }

        /* Screen Damage Effect */
        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 85, 0.3); pointer-events: none; opacity: 0; transition: opacity 0.2s;
        }

        /* Game Over Modal */
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 8, 0.92); display: none; flex-direction: column;
            justify-content: center; align-items: center; color: #fff; pointer-events: auto;
        }
        #game-over h1 { color: #ff0055; text-shadow: 0 0 25px #ff0055; font-size: 38px; margin-bottom: 10px; }
        #restart-btn {
            margin-top: 25px; padding: 14px 40px; background: #00f0ff; border: none; border-radius: 30px;
            color: #000; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 0 20px #00f0ff;
            transition: transform 0.2s;
        }
        #restart-btn:hover { transform: scale(1.05); }
    </style>
    <!-- Three.js 3D Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="damage-overlay"></div>

    <div id="ui-layer">
        <div class="hud-panel">
            <div class="hud-item">SCORE: <span id="score">0</span></div>
            <div class="hud-item" style="display:flex; align-items:center; gap:10px;">
                HP:
                <div class="health-bar-container"><div id="health-fill"></div></div>
            </div>
        </div>

        <div class="controls">
            <div class="btn-group">
                <div class="control-btn" id="btn-left">◀</div>
                <div class="control-btn" id="btn-right">▶</div>
            </div>
            <div class="control-btn fire-btn" id="btn-fire">FIRE<br>[SPACE]</div>
        </div>
    </div>

    <div id="game-over">
        <h1>SHIP DESTROYED</h1>
        <p style="font-size: 20px;">Galactic Points: <span id="final-score" style="color:#00f0ff;">0</span></p>
        <button id="restart-btn" onclick="restartGame()">RESTART WAR</button>
    </div>

    <script>
        let scene, camera, renderer, player, planet;
        let stars, starGeometry;
        let enemies = [], lasers = [], particles = [];
        let score = 0, health = 100;
        let moveLeft = false, moveRight = false;
        let isGameOver = false;

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020208, 0.015);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 9);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Sci-Fi Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0x00f0ff, 1.2);
            mainLight.position.set(10, 20, 15);
            scene.add(mainLight);

            const redLight = new THREE.PointLight(0xff0055, 1, 20);
            redLight.position.set(-10, -5, -10);
            scene.add(redLight);

            // Environment
            createStarfield();
            createBackgroundPlanet();

            // Player Ship
            createPlayerShip();

            // Event Listeners
            setupControls();

            // Spawn Cycle
            setInterval(spawnEnemy, 1200);

            // Game Loop
            animate();
        }

        function createStarfield() {
            starGeometry = new THREE.BufferGeometry();
            const count = 3000;
            const positions = new Float32Array(count * 3);

            for(let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 300;
                positions[i+1] = (Math.random() - 0.5) * 300;
                positions[i+2] = (Math.random() - 0.5) * 300;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6, transparent: true, opacity: 0.8 });
            stars = new THREE.Points(starGeometry, material);
            scene.add(stars);
        }

        function createBackgroundPlanet() {
            const geo = new THREE.SphereGeometry(12, 32, 32);
            const mat = new THREE.MeshStandardMaterial({
                color: 0x004488, roughness: 0.8, wireframe: true
            });
            planet = new THREE.Mesh(geo, mat);
            planet.position.set(25, -15, -60);
            scene.add(planet);
        }

        function createPlayerShip() {
            player = new THREE.Group();

            // Cockpit Body
            const bodyGeo = new THREE.ConeGeometry(0.7, 3, 5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.9, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.x = Math.PI / 2;
            player.add(body);

            // Wings
            const wingGeo = new THREE.BoxGeometry(3.6, 0.08, 1.2);
            const wingMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, metalness: 0.5 });
            const wings = new THREE.Mesh(wingGeo, wingMat);
            wings.position.z = 0.5;
            player.add(wings);

            // Thruster Glow
            const engineGeo = new THREE.CylinderGeometry(0.2, 0.4, 0.5);
            const engineMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
            const engine = new THREE.Mesh(engineGeo, engineMat);
            engine.rotation.x = Math.PI / 2;
            engine.position.z = 1.6;
            player.add(engine);

            player.position.y = -2;
            scene.add(player);
        }

        function spawnEnemy() {
            if(isGameOver) return;

            const enemyGroup = new THREE.Group();
            const isHeavy = Math.random() > 0.6; // 40% Chance Heavy Enemy

            if(isHeavy) {
                const geo = new THREE.DodecahedronGeometry(0.9);
                const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.8 });
                const mesh = new THREE.Mesh(geo, mat);
                enemyGroup.add(mesh);
                enemyGroup.userData = { type: 'heavy', hp: 2, speed: 0.12 };
            } else {
                const geo = new THREE.OctahedronGeometry(0.7);
                const mat = new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.4 });
                const mesh = new THREE.Mesh(geo, mat);
                enemyGroup.add(mesh);
                enemyGroup.userData = { type: 'standard', hp: 1, speed: 0.16 };
            }

            enemyGroup.position.x = (Math.random() - 0.5) * 11;
            enemyGroup.position.y = 12;
            enemyGroup.position.z = 0;

            scene.add(enemyGroup);
            enemies.push(enemyGroup);
        }

        function fireLaser() {
            if(isGameOver) return;

            // Dual Laser Fire
            [-0.8, 0.8].forEach(offsetX => {
                const geo = new THREE.CylinderGeometry(0.06, 0.06, 1.2);
                const mat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
                const laser = new THREE.Mesh(geo, mat);

                laser.position.set(player.position.x + offsetX, player.position.y + 1, player.position.z);
                scene.add(laser);
                lasers.push(laser);
            });
        }

        function createExplosion(pos, colorHex) {
            for(let i = 0; i < 12; i++) {
                const geo = new THREE.SphereGeometry(0.08);
                const mat = new THREE.MeshBasicMaterial({ color: colorHex });
                const p = new THREE.Mesh(geo, mat);
                p.position.copy(pos);
                p.userData = {
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    vz: (Math.random() - 0.5) * 0.3,
                    life: 1.0
                };
                scene.add(p);
                particles.push(p);
            }
        }

        function setupControls() {
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');
            const btnFire = document.getElementById('btn-fire');

            btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
            btnLeft.addEventListener('touchend', () => moveLeft = false);
            btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
            btnRight.addEventListener('touchend', () => moveRight = false);

            btnFire.addEventListener('touchstart', (e) => { e.preventDefault(); fireLaser(); });
            btnFire.addEventListener('mousedown', () => fireLaser());

            // Spacebar & Arrow Key Support
            window.addEventListener('keydown', (e) => {
                if(e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft = true;
                if(e.code === 'ArrowRight' || e.code === 'KeyD') moveRight = true;
                if(e.code === 'Space' && !e.repeat) fireLaser();
            });
            window.addEventListener('keyup', (e) => {
                if(e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft = false;
                if(e.code === 'ArrowRight' || e.code === 'KeyD') moveRight = false;
            });
        }

        function triggerDamageEffect() {
            const overlay = document.getElementById('damage-overlay');
            overlay.style.opacity = '1';
            setTimeout(() => overlay.style.opacity = '0', 200);
        }

        function animate() {
            if(isGameOver) return;
            requestAnimationFrame(animate);

            // Warp Speed Starfield Effect
            const pos = starGeometry.attributes.position.array;
            for(let i = 2; i < pos.length; i += 3) {
                pos[i] += 0.8;
                if(pos[i] > 100) pos[i] = -200;
            }
            starGeometry.attributes.position.needsUpdate = true;

            // Planet Rotation
            planet.rotation.y += 0.002;

            // Player Ship Smooth Tilt & Movement
            if(moveLeft && player.position.x > -5.5) {
                player.position.x -= 0.18;
                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, 0.3, 0.1);
            } else if(moveRight && player.position.x < 5.5) {
                player.position.x += 0.18;
                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -0.3, 0.1);
            } else {
                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, 0, 0.1);
            }

            // Move Lasers
            for(let i = lasers.length - 1; i >= 0; i--) {
                lasers[i].position.y += 0.5;

                // Collision with Enemies
                for(let j = enemies.length - 1; j >= 0; j--) {
                    if(lasers[i] && lasers[i].position.distanceTo(enemies[j].position) < 1.1) {
                        enemies[j].userData.hp -= 1;
                        
                        createExplosion(lasers[i].position, 0x00f0ff);
                        scene.remove(lasers[i]);
                        lasers.splice(i, 1);

                        if(enemies[j].userData.hp <= 0) {
                            createExplosion(enemies[j].position, 0xff0055);
                            scene.remove(enemies[j]);
                            score += (enemies[j].userData.type === 'heavy') ? 25 : 10;
                            enemies.splice(j, 1);
                            document.getElementById('score').innerText = score;
                        }
                        break;
                    }
                }

                if(lasers[i] && lasers[i].position.y > 15) {
                    scene.remove(lasers[i]);
                    lasers.splice(i, 1);
                }
            }

            // Move Enemies
            for(let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].position.y -= enemies[i].userData.speed;
                enemies[i].rotation.x += 0.03;
                enemies[i].rotation.y += 0.03;

                // Hit Player
                if(enemies[i].position.distanceTo(player.position) < 1.3) {
                    createExplosion(enemies[i].position, 0xff0055);
                    triggerDamageEffect();
                    scene.remove(enemies[i]);
                    enemies.splice(i, 1);

                    health -= 25;
                    document.getElementById('health-fill').style.width = health + '%';

                    if(health <= 0) endGame();
                } else if(enemies[i].position.y < -6) {
                    scene.remove(enemies[i]);
                    enemies.splice(i, 1);
                }
            }

            // Handle Explosion Particles
            for(let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.x += p.userData.vx;
                p.position.y += p.userData.vy;
                p.position.z += p.userData.vz;
                p.userData.life -= 0.04;
                p.scale.setScalar(p.userData.life);

                if(p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function endGame() {
            isGameOver = true;
            document.getElementById('game-over').style.display = 'flex';
            document.getElementById('final-score').innerText = score;
        }

        function restartGame() {
            location.reload();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
